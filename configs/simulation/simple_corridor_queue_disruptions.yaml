seed: 1
simulation:
  city_names: ["City A", "City B"]
  road_length_km: 100.0
  station_position_km: 50.0
  num_plugs: 10
  step_minutes: 5
  duration_hours: 72
  charging_stop_probability: 0.055
  service_time:
    mean_minutes: 30.0
    std_minutes: 8.0
    min_minutes: 15.0
    max_minutes: 50.0
  traffic:
    baseline_cars_per_step: 11.0
    morning_peak_hour: 8.0
    evening_peak_hour: 17.0
    morning_peak_cars_per_step: 22.0
    evening_peak_cars_per_step: 24.0
    midday_bump_hour: 12.5
    midday_bump_cars_per_step: 6.0
    peak_width_hours: 1.6
    directional_bias_amplitude: 0.24
    minimum_direction_share: 0.18
  disruption:
    enabled: true
    mode: random
    daily_event_probability: 0.6
    event_types:
      - capacity_drop
      - station_outage
      - demand_surge_ab
      - demand_surge_ba
      - service_time_inflation
    capacity_drop:
      target_num_plugs: 3
      duration_hours: 2.0
      start_hour_range: [7.0, 18.0]
    station_outage:
      duration_hours: 1.5
      start_hour_range: [7.0, 19.5]
    demand_surge:
      multiplier: 1.8
      duration_hours: 2.0
      start_hour_range: [7.0, 19.0]
    service_time_inflation:
      multiplier: 1.5
      duration_hours: 2.0
      start_hour_range: [7.0, 19.0]
    scripted_events:
      - disruption_type: station_outage
        day_index: 1
        start_hour: 8.0
        duration_hours: 1.5
        severity: 0.0

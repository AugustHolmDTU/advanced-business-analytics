rl:
  backend: torch_dqn
  device: auto
  torch_num_threads: 8
  torch_num_interop_threads: 1
  checkpoint_name: best_model.pt
  episodes: 450
  max_steps_per_episode: 24
  gamma: 0.99
  learning_rate: 0.00025
  batch_size: 128
  replay_capacity: 40000
  learning_starts: 1000
  target_update_interval: 250
  train_frequency: 1
  gradient_steps: 4
  hidden_dims: [256, 256]
  epsilon_start: 1.0
  epsilon_end: 0.03
  epsilon_decay_steps: 8000
  tau: 1.0
  reward_clip: 10.0
  heuristic_prior_strength: 2.5
  evaluation_episodes: 16
  deterministic_eval: true
  sb3:
    total_timesteps: 22000
    buffer_size: 40000
    learning_starts: 1000
    batch_size: 128
    tau: 1.0
    target_update_interval: 500

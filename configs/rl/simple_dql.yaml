rl:
  backend: torch_dql
  checkpoint_name: best_model.pt
  episodes: 120
  max_steps_per_episode: 24
  gamma: 0.98
  learning_rate: 0.0005
  hidden_dims: [128, 128]
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 3000
  reward_clip: 10.0
  train_frequency: 1
  wandb_step_log_interval: 12
  evaluation_episodes: 12
  deterministic_eval: true
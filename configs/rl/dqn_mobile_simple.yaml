rl:
  backend: torch_dqn
  checkpoint_name: best_model.pt
  episodes: 80
  max_steps_per_episode: 288
  gamma: 0.98
  learning_rate: 0.0005
  batch_size: 64
  replay_capacity: 40000
  learning_starts: 2000
  target_update_interval: 200
  train_frequency: 1
  gradient_steps: 2
  hidden_dims: [128, 128]
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 12000
  tau: 1.0
  reward_clip: 25.0
  heuristic_prior_strength: 0.0
  heuristic_prior_mode: placement
  wandb_step_log_interval: 12
  evaluation_episodes: 8
  eval_interval_episodes: 15
  eval_during_training_episodes: 6
  deterministic_eval: true
  sb3:
    total_timesteps: 12000
    buffer_size: 12000
    learning_starts: 500
    batch_size: 64
    tau: 1.0
    target_update_interval: 500

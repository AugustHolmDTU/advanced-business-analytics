rl:
  backend: torch_dqn
  checkpoint_name: best_model.pt
  episodes: 36
  max_steps_per_episode: 576
  learning_rate: 0.0005
  batch_size: 64
  replay_capacity: 40000
  learning_starts: 2000
  target_update_interval: 200
  train_frequency: 1
  gradient_steps: 2
  hidden_dims: [128, 128]
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 12000
  wandb_step_log_interval: 24
  evaluation_episodes: 4
  eval_interval_episodes: 12
  eval_during_training_episodes: 2
  deterministic_eval: true

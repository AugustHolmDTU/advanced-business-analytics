seed: 21
environment:
  env_type: mobile_station_capacity
  num_candidate_sites: 1
  num_demand_zones: 8
  horizon: 24
  max_steps: 24
  city_extent_km: 6.0
  randomize_on_reset: false
  base_station_plugs: 12
  max_mobile_stations: 10
  mobile_station_chargers: 2
  mobile_station_capacity: 20.0
  planning_step_minutes: 60.0
  vehicle_arrival_scale: 4.0
  queue_normalizer: 120.0
  arrival_normalizer: 30.0
  reward_scale: 0.1
  service_time:
    mean_minutes: 30.0
  disruption:
    enabled: true
    mode: scripted
    scripted_events:
      - disruption_type: capacity_drop
        start_hour: 6.0
        duration_hours: 2.0
        severity: 3.0

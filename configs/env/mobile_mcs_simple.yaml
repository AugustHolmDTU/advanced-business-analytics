        start_hour: 8.0
        duration_hours: 2.0
        severity: 1.8
      - disruption_type: service_time_inflation
        start_hour: 11.0
        duration_hours: 2.0
        severity: 1.5
      - disruption_type: demand_surge_ba
        start_hour: 15.0
        duration_hours: 2.0
        severity: 1.8
      - disruption_type: station_outage
        start_hour: 17.0
        duration_hours: 2.0
        severity: 0.0
  reward:
    served_reward_weight: 1.0
    unmet_penalty: 2.5
    active_mobile_station_cost: 30.0
    activation_cost: 8.0
    adjustment_cost: 3.0
    idle_capacity_penalty: 0.15

environment:
  num_candidate_sites: 20
  num_demand_zones: 90
  max_chargers: 6
  charger_capacity: 10.0
  horizon: 24
  max_steps: 24
  service_decay: 0.12
  deployment_cost: 0.25
  relocation_cost: 0.5
  unmet_penalty: 1.3
  outage_penalty: 0.2
  city_extent_km: 4.0
  start_filled: false
  city_data:
    source: tomtom_snapshot
    snapshot_path: outputs/tomtom_frederiksberg/tomtom/snapshot.json
  disruption:
    demand_spike_probability: 0.1
    demand_spike_multiplier: 1.6
    outage_probability: 0.1
    outage_fraction: 0.2
    observation_noise_scale: 0.3

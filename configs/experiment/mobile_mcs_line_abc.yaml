experiment:
  name: mobile_mcs_line_abc
  output_root: outputs
  save_plots: true
comparison_rollout:
  enabled: true
  num_days: 3
  seed: 123
  repeat_daily_disruptions: false
evaluation:
  episodes: 12
  disruptions: false
  policies:
    - rl
    - mobile_threshold
    - mobile_noop
    - random
train_val_test:
  validation:
    episodes: 12
    seed_offset: 17
  test:
    enabled: true
    comparison_rollout:
      num_days: 5
      seed: 777
      repeat_daily_disruptions: false
      scripted_events: []
      environment_overrides:
        simulation:
          disruption:
            enabled: true
            mode: random
            daily_event_probability: 0.8
            event_types:
              - demand_surge
            demand_surge:
              duration_hours: [2.0, 3.5]
              start_hour_range: [6.0, 20.0]
              multiplier: 2.4
              targets:
                - od_ab
                - od_ba

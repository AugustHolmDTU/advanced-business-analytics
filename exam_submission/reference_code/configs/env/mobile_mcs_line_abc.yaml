seed: 21
environment:
  env_type: line_corridor_mobile_mcs
  max_mobile_stations: 10
  mobile_station_chargers: 2
  mobile_station_capacity: 20.0
  reset_seed_stride: 97
  reward_scale: 0.1
  queue_normalizer: 80.0
  arrival_normalizer: 20.0
  reward:
    served_reward_weight: 1.0
    unmet_penalty: 2.5
    active_mobile_station_cost: 18.0
    activation_cost: 2.0
    adjustment_cost: 0.5
    idle_capacity_penalty: 0.1
    utilization_bonus: 1.0
    queue_length_penalty: 2.5
    queue_wait_penalty: 0.02
    local_queue_peak_penalty: 1.0
    local_wait_peak_penalty: 0.1
    spatial_deficit_alignment_bonus: 24.0
    spatial_deficit_direction_bonus: 12.0
  simulation:
    duration_days_range: [2, 6]
    city_names: ["City A", "City B", "City C"]
    inter_city_distance_km: 100.0
    station_positions_km: [50.0, 150.0]
    num_plugs: [12, 12]
    step_minutes: 5
    duration_hours: 24
    charging_stop_probability: 0.055
    service_time:
      mean_minutes: 30.0
      std_minutes: 8.0
      min_minutes: 15.0
      max_minutes: 50.0
    traffic:
      baseline_cars_per_step: 26.0
      morning_peak_hour: 8.0
      evening_peak_hour: 17.0
      morning_peak_cars_per_step: 54.0
      evening_peak_cars_per_step: 60.0
      midday_bump_hour: 12.5
      midday_bump_cars_per_step: 14.0
      peak_width_hours: 1.6
      directional_bias_amplitude: 0.24
      middle_city_share: 0.34
      long_trip_share: 0.35
      middle_destination_bias_amplitude: 0.18
    disruption:
      enabled: true
      mode: random
      day_disruption_count_weights:
        0: 0.1
        1: 0.45
        2: 0.3
        3: 0.15
      event_types:
        - capacity_drop
        - station_outage
        - service_time_inflation
        - demand_surge
      capacity_drop:
        duration_hours: [1.0, 3.5]
        start_hour_range: [6.0, 20.0]
        target_num_plugs: [1, 5]
        targets:
          - station_ab
          - station_bc
      station_outage:
        duration_hours: [1.0, 2.5]
        start_hour_range: [6.0, 21.0]
        targets:
          - station_ab
          - station_bc
      service_time_inflation:
        duration_hours: [1.0, 3.5]
        start_hour_range: [6.0, 20.0]
        multiplier: [1.5, 2.1]
        targets:
          - station_ab
          - station_bc
      demand_surge:
        duration_hours: [1.5, 4.5]
        start_hour_range: [6.0, 20.0]
        multiplier: [1.9, 2.9]
        targets:
          - od_ab
          - od_ba
          - od_cb
          - od_bc
          - od_ac
          - od_ca

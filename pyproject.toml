[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-ev-charging"
version = "0.1.0"
description = "Minimal research codebase for adaptive EV charging placement under uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DTU Course Project Team" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "torch>=2.1",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
evch-generate-data = "evch.train.generate_synthetic_data:main"
evch-fetch-tomtom = "evch.train.fetch_tomtom_snapshot:main"
evch-train-uncertainty = "evch.train.train_uncertainty:main"
evch-train-rl = "evch.train.train_rl:main"
evch-eval = "evch.train.evaluate_policies:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
